<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evretis - Coming Soon</title>
    <style>
        body {
            background-color: #001f3f; /* Dark Blue */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            text-align: center;
        }

        header {
            margin-top: 2rem;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            margin: 0;
        }

        .logo-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
        }

        /* Placeholder for your actual logo image */
        .main-logo {
            max-width: 80%;
            height: auto;
            border: 2px dashed rgba(255, 255, 255, 0.3); /* Visual guide for logo area */
            padding: 50px;
        }

        .tagline {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .orange { color: #FFA500; }
        .blue { color: #0074D9; }
        .yellow { color: #FFDC00; }

        .description {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 3rem;
        }

        footer {
            margin-bottom: 2rem;
            font-style: italic;
            font-size: 1.1rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <header>
        <h1>Evretis</h1>
    </header>

    <main class="logo-container">
        <!-- Replace 'logo.png' with your actual image path -->
       <img src="logo.png" alt="Evretis Logo" class="main-logo"> 

    </main>

    <section>
        <div class="tagline">
            <span class="orange">Discover</span> 
            <span class="blue">Plan</span> 
            <span class="yellow">Experience</span>
        </div>
        
        <p class="description">Discover upcoming events in your area</p>
    </section>

    <footer>
        Coming soon...
    </footer>

</body>
</html>
